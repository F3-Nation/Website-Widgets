<!DOCTYPE html>
<!--
  ============================================================
  F3 NATION DAILY NUMBERS
  ============================================================
  Shows the PAX count posted at each AO on a given day, pulled
  live from submitted backblasts on the F3 Nation API. Built for
  a region's Weasel Shaker to screenshot and post the daily
  numbers to Slack / social after the backblasts are in.

  HOW TO USE
  ----------
  Open with your region's ID in the URL:
     /numbers.html?regionOrgId=25207&title=F3%20Lexington
  Optional params:
     &siteUrl=https://your-site.com   (footer link)
     &date=2026-07-13                 (jump straight to a day)

  Only AOs that already have a backblast posted show up — so you
  can't screenshot the numbers before they're actually in.

  No API token is needed here — it's stored securely on the
  server. This file is safe to share publicly.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F3 Daily Numbers</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #e5e5e5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 14px 60px;
  -webkit-font-smoothing: antialiased;
}

/* ── Controls (NOT part of the screenshot) ── */
.f3n-controls {
  width: 100%;
  max-width: 460px;
  min-width: 0;              /* allow shrink below content on narrow screens */
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.f3n-nav {
  border: 1px solid #ccc;
  background: #fff;
  color: #111;
  font-size: 18px;
  font-weight: 800;
  width: 42px;
  height: 42px;
  border-radius: 8px;
  cursor: pointer;
  line-height: 1;
  flex-shrink: 0;
}
.f3n-nav:hover { background: #111; color: #fff; border-color: #111; }
.f3n-nav:disabled { opacity: .35; cursor: default; }
.f3n-datewrap { flex: 1; min-width: 120px; position: relative; }
.f3n-date {
  width: 100%;
  height: 42px;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 0 12px;
  font-size: 15px;
  font-family: inherit;
  font-weight: 600;
  color: #111;
  background: #fff;
}
.f3n-copy {
  height: 42px;
  padding: 0 16px;
  border: none;
  border-radius: 8px;
  background: #c8102e;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  flex-shrink: 0;
}
.f3n-copy:hover { background: #a50d24; }
.f3n-copy.done { background: #1a6b35; }

/* ── The card (this is what gets screenshotted) ── */
#f3n-card {
  background: #fff;
  color: #111;
  max-width: 460px;
  width: 100%;
  min-width: 0;              /* allow shrink below content floor so the
                               right-hand PAX numbers never get clipped */
  border: 1px solid #ddd;
  overflow: hidden;
}

.f3n-hdr {
  background: #111;
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.f3n-hdr-mark {
  width: 44px; height: 44px; flex-shrink: 0;
  object-fit: contain; background: #fff; border-radius: 3px; padding: 2px;
}
.f3n-hdr-text { flex: 1; }
.f3n-hdr-name { font-size: 17px; font-weight: 800; letter-spacing: .02em; line-height: 1; }
.f3n-hdr-tag {
  font-size: 10px; color: #aaa; letter-spacing: .12em;
  text-transform: uppercase; margin-top: 4px;
}
.f3n-hdr-label {
  font-size: 10px; color: #c8102e; text-align: right;
  letter-spacing: .12em; text-transform: uppercase; font-weight: 800; line-height: 1.5;
}

/* Date banner */
.f3n-dateband {
  background: #c8102e;
  color: #fff;
  padding: 10px 20px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}
.f3n-dateband-day { font-size: 15px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.f3n-dateband-date { font-size: 12px; font-weight: 600; opacity: .85; }

/* AO rows */
.f3n-row {
  padding: 13px 20px;
  border-bottom: 1px solid #f0f0f0;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
}
.f3n-row:last-child { border-bottom: none; }
.f3n-ao { min-width: 0; }
.f3n-ao-name {
  font-size: 16px; font-weight: 800; color: #111;
  letter-spacing: .01em; line-height: 1.1; text-transform: uppercase;
}
.f3n-ao-sub {
  font-size: 11px; color: #999; margin-top: 3px;
  letter-spacing: .04em;
}
.f3n-ao-fng {
  display: inline-block; margin-top: 5px;
  font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 20px;
  background: #dcf5e6; color: #1a6b35;
}
.f3n-count { text-align: right; line-height: 1; }
.f3n-count-num {
  font-size: 30px; font-weight: 800; color: #c8102e;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.f3n-count-lbl {
  font-size: 9px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: #aaa; margin-top: 3px;
}
.f3n-count-none { font-size: 12px; font-weight: 700; color: #bbb; text-transform: uppercase; letter-spacing: .06em; }

/* Totals footer */
.f3n-totals {
  background: #111;
  color: #fff;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  text-align: center;
}
.f3n-total-num { font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.f3n-total-num.red { color: #ff415f; }
.f3n-total-lbl { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #888; margin-top: 5px; }
.f3n-total-div { width: 1px; align-self: stretch; background: #333; }

.f3n-ftr {
  background: #f7f7f7;
  border-top: 1px solid #eee;
  padding: 9px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.f3n-ftr a {
  font-size: 11px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: #888; text-decoration: none;
}
.f3n-ftr a:hover { color: #111; }
.f3n-ftr-brand { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #c8102e; }

/* States */
.f3n-state {
  padding: 44px 22px; text-align: center; font-size: 13px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase; color: #aaa;
}
.f3n-state-spin {
  width: 26px; height: 26px; border: 3px solid #eee; border-top-color: #c8102e;
  border-radius: 50%; animation: f3spin .7s linear infinite; margin: 0 auto 14px;
}
@keyframes f3spin { to { transform: rotate(360deg); } }

.f3n-hint {
  max-width: 460px; width: 100%; margin-top: 12px;
  font-size: 11px; color: #999; text-align: center; line-height: 1.5;
}
</style>
</head>
<body>

<script>
var F3N = {
  REGION_ORG_ID : new URLSearchParams(location.search).get('regionOrgId') || 25273,
  PROXY_URL     : location.origin,
  WIDGET_TITLE  : new URLSearchParams(location.search).get('title') || 'F3 Nation',
  REGION_URL    : new URLSearchParams(location.search).get('siteUrl') || 'https://f3nation.com',
  INIT_DATE     : new URLSearchParams(location.search).get('date') || null,
};

(function () {
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var nameEl = document.getElementById('f3n-name');
  var bodyEl = document.getElementById('f3n-body');
  var dateEl = document.getElementById('f3n-date');
  var prevEl = document.getElementById('f3n-prev');
  var nextEl = document.getElementById('f3n-next');
  var copyEl = document.getElementById('f3n-copy');
  var siteEl = document.getElementById('f3n-sitelink');

  nameEl.textContent = F3N.WIDGET_TITLE;
  if (siteEl) siteEl.href = F3N.REGION_URL;

  // Local (not UTC) YYYY-MM-DD so "today" matches the user's calendar day
  function ymd(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  var todayStr = ymd(new Date());
  var current = (F3N.INIT_DATE && /^\d{4}-\d{2}-\d{2}$/.test(F3N.INIT_DATE))
    ? F3N.INIT_DATE : todayStr;

  dateEl.max = todayStr;         // no future days — numbers don't exist yet
  var lastRender = null;         // holds the current day object for Copy

  function shiftDate(days) {
    var d = new Date(current + 'T12:00:00');
    d.setDate(d.getDate() + days);
    var s = ymd(d);
    if (s > todayStr) return;    // don't go into the future
    current = s;
    loadDate();
  }

  prevEl.addEventListener('click', function () { shiftDate(-1); });
  nextEl.addEventListener('click', function () { shiftDate(1); });
  dateEl.addEventListener('change', function () {
    if (dateEl.value) { current = dateEl.value; loadDate(); }
  });

  function fmtTime(raw) {
    if (!raw) return '';
    var h = parseInt(raw.slice(0, 2), 10);
    var m = raw.slice(2);
    var ap = h >= 12 ? 'PM' : 'AM';
    var h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
    return h12 + ':' + m + ' ' + ap;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function render(day) {
    var d = new Date(current + 'T12:00:00');
    var dName = current === todayStr ? 'Today' : DAYS[d.getDay()];
    var dDate = DAYS[d.getDay()].slice(0, 3) + ', ' + MONS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();

    var band =
      '<div class="f3n-dateband">' +
        '<span class="f3n-dateband-day">' + dName + '</span>' +
        '<span class="f3n-dateband-date">' + dDate + '</span>' +
      '</div>';

    if (!day || !day.events.length) {
      bodyEl.innerHTML = band +
        '<div class="f3n-state">No backblasts posted<br>for this day yet</div>';
      lastRender = null;
      return;
    }

    var rows = day.events.map(function (e) {
      var count = e.hasCount
        ? '<div class="f3n-count-num">' + e.pax + '</div><div class="f3n-count-lbl">PAX</div>'
        : '<div class="f3n-count-none">— </div><div class="f3n-count-lbl">no count</div>';
      var sub = e.startTime ? '<div class="f3n-ao-sub">' + fmtTime(e.startTime) + '</div>' : '';
      var fng = e.fng > 0 ? '<span class="f3n-ao-fng">' + e.fng + ' FNG' + (e.fng > 1 ? 's' : '') + '</span>' : '';
      return '<div class="f3n-row">' +
        '<div class="f3n-ao"><div class="f3n-ao-name">' + esc(e.ao) + '</div>' + sub +
          (fng ? '<div>' + fng + '</div>' : '') +
        '</div>' +
        '<div class="f3n-count">' + count + '</div>' +
      '</div>';
    }).join('');

    var totals =
      '<div class="f3n-totals">' +
        '<div><div class="f3n-total-num red">' + day.paxTotal + '</div><div class="f3n-total-lbl">Total PAX</div></div>' +
        '<div class="f3n-total-div"></div>' +
        '<div><div class="f3n-total-num">' + day.aoCount + '</div><div class="f3n-total-lbl">AOs Posting</div></div>' +
        (day.fngTotal > 0
          ? '<div class="f3n-total-div"></div><div><div class="f3n-total-num">' + day.fngTotal + '</div><div class="f3n-total-lbl">FNGs</div></div>'
          : '') +
      '</div>';

    bodyEl.innerHTML = band + rows + totals;
    lastRender = { day: day, dName: dName, dDate: dDate };
  }

  function copyText() {
    if (!lastRender) return;
    var day = lastRender.day;
    var lines = [];
    lines.push(F3N.WIDGET_TITLE + ' — Numbers, ' + lastRender.dDate);
    day.events.forEach(function (e) {
      var n = e.hasCount ? e.pax + ' PAX' : 'no count';
      lines.push(e.ao + ': ' + n + (e.fng > 0 ? ' (' + e.fng + ' FNG' + (e.fng > 1 ? 's' : '') + ')' : ''));
    });
    lines.push('');
    lines.push('Total: ' + day.paxTotal + ' PAX across ' + day.aoCount + ' AO' + (day.aoCount > 1 ? 's' : '') +
      (day.fngTotal > 0 ? ', ' + day.fngTotal + ' FNG' + (day.fngTotal > 1 ? 's' : '') : ''));
    var text = lines.join('\n');

    var done = function () {
      copyEl.textContent = 'Copied!';
      copyEl.classList.add('done');
      setTimeout(function () { copyEl.textContent = 'Copy'; copyEl.classList.remove('done'); }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy the numbers:', text); });
    } else {
      window.prompt('Copy the numbers:', text);
    }
  }
  copyEl.addEventListener('click', copyText);

  var base = F3N.PROXY_URL + '/.netlify/functions/region-numbers'
    + '?regionOrgId=' + encodeURIComponent(F3N.REGION_ORG_ID);

  function spinner() {
    dateEl.value = current;
    nextEl.disabled = current >= todayStr;
    bodyEl.innerHTML = '<div class="f3n-state"><div class="f3n-state-spin"></div>Loading numbers…</div>';
    lastRender = null;
  }

  function showError(err) {
    bodyEl.innerHTML =
      '<div class="f3n-dateband"><span class="f3n-dateband-day">Error</span></div>' +
      '<div class="f3n-state">Could not load numbers —<br>check the region ID</div>';
    console.error('[F3 Numbers]', err);
  }

  // Load one specific day (used by the picker and the ‹ › steppers).
  function loadDate() {
    spinner();
    fetch(base + '&date=' + encodeURIComponent(current))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.error) throw new Error(data.error);
        var day = (data.days || []).find(function (x) { return x.date === current; }) || null;
        nextEl.disabled = current >= todayStr;
        render(day);
      })
      .catch(showError);
  }

  // Initial load with no explicit date: land on the most recent day that
  // actually has numbers in, so the page is never blank first thing.
  function loadLatest() {
    spinner();
    fetch(base + '&daysBack=21')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.error) throw new Error(data.error);
        var days = data.days || [];
        if (!days.length) {                 // nothing posted in the last 3 weeks
          current = todayStr;
          dateEl.value = current;
          nextEl.disabled = true;
          render(null);
          return;
        }
        current = days[0].date;             // days come back newest-first
        dateEl.value = current;
        nextEl.disabled = current >= todayStr;
        render(days[0]);
      })
      .catch(showError);
  }

  if (F3N.INIT_DATE && /^\d{4}-\d{2}-\d{2}$/.test(F3N.INIT_DATE)) {
    current = F3N.INIT_DATE;
    loadDate();
  } else {
    loadLatest();
  }
})();
</script>
</body>
</html>
