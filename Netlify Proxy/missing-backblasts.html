<!DOCTYPE html>
<!--
  ============================================================
  F3 NATION MISSING BACKBLASTS WIDGET ("COLD CASES")
  ============================================================
  This file shows your region's past workouts that do NOT yet
  have a backblast posted. Data is pulled live from the F3
  Nation API. It is self-contained — no plugins, no accounts,
  no maintenance required.

  HOW TO USE THIS ON YOUR WEBSITE
  --------------------------------
  You only need to do THREE things:

  STEP 1 — Find the CONFIG section below (search for "CONFIG")
           and fill in your region's values. There are only
           5 things to change. Instructions are next to each one.

  STEP 2 — Copy the widget HTML block (marked with
           "COPY FROM HERE" and "END COPY") and paste it
           wherever you want the widget to appear on your page.

  STEP 3 — Copy the <style> block and the <script> block into
           your page as well. Both are clearly marked.

  COMMON WEBSITE PLATFORMS
  -------------------------
  WordPress  → Use a "Custom HTML" block in the page editor
  Squarespace → Add a "Code Block" in your page
  Wix        → Add an "HTML iFrame" widget
  Weebly     → Use the "Embed Code" element
  Raw HTML   → Paste directly into your page's HTML file

  NEED HELP?
  ----------
  If you're not sure what your REGION_ORG_ID is, ask in the
  F3 tech channel and someone can look it up for you. No API
  token is needed — authentication is handled securely on the
  server. This file is safe to share publicly.
  ============================================================
-->

<head>
<meta charset="UTF-8">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

#f3-cc {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #fff;
  color: #111;
  max-width: 520px;
  width: 100%;
  border: 1px solid #ddd;
}

/* HEADER */
.f3cc-hdr {
  background: #111;
  color: #fff;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.f3cc-hdr-mark {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 3px;
}
.f3cc-hdr-text { flex: 1; }
.f3cc-hdr-name {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .02em;
  line-height: 1;
}
.f3cc-hdr-tag {
  font-size: 10px;
  color: #aaa;
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-top: 3px;
}
.f3cc-hdr-label {
  font-size: 10px;
  color: #888;
  text-align: right;
  letter-spacing: .1em;
  text-transform: uppercase;
  line-height: 1.5;
}

/* STAT BAR */
.f3cc-stat {
  background: #c8102e;
  color: #fff;
  padding: 14px 18px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
}
.f3cc-stat-num {
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.01em;
  font-variant-numeric: tabular-nums;
}
.f3cc-stat-lbl {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #ffd5dc;
  line-height: 1.4;
  text-align: right;
}

/* AO LEADERBOARD (top offenders) */
.f3cc-board {
  padding: 12px 18px;
  border-bottom: 1px solid #eee;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.f3cc-board-lbl {
  width: 100%;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 4px;
}
.f3cc-board-chip {
  background: #f7f7f7;
  border: 1px solid #e5e5e5;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: #333;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.f3cc-board-chip strong {
  color: #c8102e;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/* DAY GROUPS */
.f3cc-day { border-bottom: 1px solid #eee; }
.f3cc-day:last-child { border-bottom: none; }

.f3cc-day-hdr {
  background: #f7f7f7;
  padding: 6px 16px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #555;
  border-bottom: 1px solid #eee;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.f3cc-day-age {
  font-weight: 400;
  opacity: .7;
  font-size: 10px;
  letter-spacing: .08em;
}

/* EVENT ROWS */
.f3cc-row {
  padding: 10px 16px;
  border-bottom: 1px solid #f0f0f0;
  display: grid;
  grid-template-columns: 62px 1fr auto;
  gap: 12px;
  align-items: center;
}
.f3cc-row:last-child { border-bottom: none; }
.f3cc-row:hover { background: #fafafa; }

.f3cc-time { text-align: right; line-height: 1; }
.f3cc-time-val {
  font-size: 16px;
  font-weight: 800;
  color: #c8102e;
  font-variant-numeric: tabular-nums;
}
.f3cc-time-ap {
  font-size: 9px;

  letter-spacing: .1em;
  text-transform: uppercase;
  color: #aaa;
  margin-top: 2px;
}

.f3cc-ao {
  font-size: 15px;
  font-weight: 700;
  color: #111;
  letter-spacing: .01em;
  line-height: 1.15;
  text-transform: uppercase;
}
.f3cc-evname {
  font-size: 11px;
  color: #888;
  margin-top: 2px;
  font-weight: 500;
}

.f3cc-age {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: #aaa;
  text-align: right;
  min-width: 64px;

}
.f3cc-age strong {
  display: block;
  font-size: 15px;
  color: #111;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

/* STATE */
.f3cc-state {
  padding: 36px 18px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #aaa;
}
.f3cc-state-spin {
  width: 24px;
  height: 24px;
  border: 3px solid #eee;
  border-top-color: #c8102e;
  border-radius: 50%;
  animation: f3ccspin .7s linear infinite;
  margin: 0 auto 12px;
}
@keyframes f3ccspin { to { transform: rotate(360deg); } }

.f3cc-state-ok {
  padding: 40px 18px;
  text-align: center;
}
.f3cc-state-ok-icon {
  font-size: 28px;
  margin-bottom: 6px;
}
.f3cc-state-ok-txt {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;

}

/* FOOTER */
.f3cc-ftr {
  background: #f7f7f7;
  border-top: 1px solid #eee;
  padding: 9px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.f3cc-ftr a {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;

}
.f3cc-ftr a:hover { color: #111; }
.f3cc-ftr-brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #c8102e;
}

/* NOTE BAR — tells the user if the API limit was hit */
.f3cc-note {
  background: #fff8dc;
  border-top: 1px solid #f0e5a8;
  padding: 8px 16px;
  font-size: 11px;
  color: #7a5010;
  text-align: center;
  font-weight: 500;
}
</style>

<script>

// ============================================================
// CONFIG — THIS IS THE ONLY PART YOU NEED TO CHANGE
// ============================================================
var F3CC = {

  // YOUR REGION'S ID NUMBER from F3 Nation.
  // Find it in the F3 Nation app under: Settings → Region → orgId
  // Or ask in the F3 tech channel and someone can look it up for you.
  // Reads regionOrgId from the URL automatically.
  // e.g. https://your-site.netlify.app/missing-backblasts.html?regionOrgId=25273
  // If not in URL, falls back to the default below.
  REGION_ORG_ID : new URLSearchParams(window.location.search).get('regionOrgId') || 25273,

  // The URL of your Netlify deployment.
  // Leave this as-is — it automatically points to your Netlify site.
  PROXY_URL : window.location.origin,

  // How far back to look for missing backblasts.
  // 30 = last month, 90 = last quarter (default), 365 = past year.
  // Use 0 for "since January 1 of the current year".
  // Override with ?daysBack=30 in the URL.
  DAYS_BACK : (function(){
    var v = new URLSearchParams(window.location.search).get('daysBack');
    return v === null ? 90 : parseInt(v, 10);
  })(),

  // Your region's name — shown in the widget header.
  WIDGET_TITLE  : new URLSearchParams(window.location.search).get('title') || 'F3 Nation',

  // The URL of your region's website (shown in footer).
  REGION_URL    : new URLSearchParams(window.location.search).get('siteUrl') || 'https://f3nation.com',

};
// ============================================================
// END CONFIG
// ============================================================


(function() {

  document.getElementById('f3cc-name').textContent = F3CC.WIDGET_TITLE;
  var sl = document.getElementById('f3cc-sitelink');
  if (sl) sl.href = F3CC.REGION_URL;

  var url = F3CC.PROXY_URL
    + '/.netlify/functions/region-missing-backblasts'
    + '?regionOrgId=' + encodeURIComponent(F3CC.REGION_ORG_ID)
    + '&daysBack='    + encodeURIComponent(F3CC.DAYS_BACK);

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){

      if (data.error) {
        document.getElementById('f3cc-body').innerHTML =
          '<div class="f3cc-state">Could not load cold cases —<br>' + data.error + '</div>';
        return;
      }

      var events = data.events || [];

      if (!events.length) {
        document.getElementById('f3cc-body').innerHTML =
          '<div class="f3cc-state-ok">'
            + '<div class="f3cc-state-ok-icon">✓</div>'
            + '<div class="f3cc-state-ok-txt">All caught up — no cold cases</div>'
          + '</div>';
        return;
      }

      // Stat bar
      var sinceLabel = data.cutoff
        ? 'Since ' + formatShortDate(data.cutoff)
        : 'Missing backblasts';
      var html = ''
        + '<div class="f3cc-stat">'
        +   '<div class="f3cc-stat-num">' + events.length + '</div>'
        +   '<div class="f3cc-stat-lbl">Missing<br>Backblasts<br>' + sinceLabel + '</div>'
        + '</div>';

      // AO leaderboard (top 6 AOs by count)
      var byAo = {};
      events.forEach(function(e){
        var ao = e.orgName || e.name || 'Unknown';
        byAo[ao] = (byAo[ao] || 0) + 1;
      });
      var leaderboard = Object.keys(byAo)
        .map(function(k){ return { name: k, count: byAo[k] }; })
        .sort(function(a,b){ return b.count - a.count; })
        .slice(0, 6);

      if (leaderboard.length > 1) {
        html += '<div class="f3cc-board">';
        html += '<div class="f3cc-board-lbl">Top Offenders</div>';
        leaderboard.forEach(function(l){
          html += '<span class="f3cc-board-chip"><strong>' + l.count + '</strong>' + escapeHtml(l.name) + '</span>';
        });
        html += '</div>';
      }

      // Group events by date (they come newest-first already)
      var byDate = {};
      events.forEach(function(e){
        if (!byDate[e.startDate]) byDate[e.startDate] = [];
        byDate[e.startDate].push(e);
      });

      var dates = Object.keys(byDate).sort().reverse();  // newest first
      var days  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var mons  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

      var todayLocal = new Date();
      todayLocal.setHours(0,0,0,0);

      dates.forEach(function(ds){
        var d       = new Date(ds + 'T12:00:00');
        var dName   = days[d.getDay()];
        var dDate   = mons[d.getMonth()] + ' ' + d.getDate();
        var ageDays = Math.round((todayLocal - new Date(ds + 'T12:00:00')) / 86400000);
        var ageTxt  = ageDays === 1 ? '1 day ago' : ageDays + ' days ago';

        html += '<div class="f3cc-day">';
        html += '<div class="f3cc-day-hdr">'
             +   '<span>' + dName + ' <span style="font-weight:400;opacity:.7">' + dDate + '</span></span>'
             +   '<span class="f3cc-day-age">' + ageTxt + '</span>'
             + '</div>';

        byDate[ds]
          .sort(function(a,b){ return (a.orgName || '').localeCompare(b.orgName || ''); })
          .forEach(function(e){
            var raw = e.startTime || '';
            var timeHtml = '<div class="f3cc-time-val">—</div>';
            if (raw && raw.length >= 4) {
              var h   = parseInt(raw.slice(0,2), 10);
              var m   = raw.slice(2,4);
              var ap  = h >= 12 ? 'PM' : 'AM';
              var h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h);
              timeHtml = '<div class="f3cc-time-val">' + h12 + ':' + m + '</div>'
                      + '<div class="f3cc-time-ap">' + ap + '</div>';
            }

            var ao      = e.orgName || e.name || 'Unknown';
            var evName  = (e.name && e.name !== ao) ? e.name : '';

            html += '<div class="f3cc-row">'
                 +   '<div class="f3cc-time">' + timeHtml + '</div>'
                 +   '<div>'
                 +     '<div class="f3cc-ao">' + escapeHtml(ao) + '</div>'
                 +     (evName ? '<div class="f3cc-evname">' + escapeHtml(evName) + '</div>' : '')
                 +   '</div>'
                 +   '<div class="f3cc-age"><strong>' + ageDays + '</strong>d old</div>'
                 + '</div>';
          });

        html += '</div>';
      });

      if (data.apiLimitHit) {
        html += '<div class="f3cc-note">'
             + 'API returned the maximum ' + data.apiReturned + ' rows — older missing backblasts may not be shown. '
             + 'Lower DAYS_BACK if the count feels wrong.'
             + '</div>';
      }

      document.getElementById('f3cc-body').innerHTML = html;
    })
    .catch(function(err){
      document.getElementById('f3cc-body').innerHTML =
        '<div class="f3cc-state">Could not load cold cases —<br>check your region ID and token</div>';
      console.error('[F3 Cold Cases]', err);
    });

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatShortDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    var mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return mons[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

})();

</script>
